# GraphQL схема сервиса client-info
# Заменяет REST API, позволяя потребителям запрашивать
# только нужные данные клиента в одном запросе

schema {
  query: Query
}

"""Корневой тип запросов сервиса управления клиентскими данными"""
type Query {
  """Получить информацию о клиенте по ID.
  Заменяет GET /clients/{id}, GET /clients/{id}/documents, GET /clients/{id}/relatives"""
  client(
    """ID клиента"""
    id: ID!
  ): Client
}

"""Клиент — основной субъект данных"""
type Client {
  """Возраст клиента"""
  age: Int
  """Документы клиента. Заменяет GET /clients/{id}/documents — запрашивается опционально"""
  documents: [Document]
  """Идентификатор клиента"""
  id: ID!
  """ФИО клиента"""
  name: String
  """Родственники клиента. Заменяет GET /clients/{id}/relatives — запрашивается опционально"""
  relatives: [Relative]
}

"""Документ, удостоверяющий личность клиента"""
type Document {
  """Дата окончания действия документа"""
  expiryDate: String
  """Идентификатор документа"""
  id: ID!
  """Дата выдачи документа"""
  issueDate: String
  """Номер документа"""
  number: String
  """Тип документа (паспорт, СНИЛС и т.д.)"""
  type: String
}

"""Родственник клиента"""
type Relative {
  """Возраст родственника"""
  age: Int
  """Идентификатор родственника"""
  id: ID!
  """ФИО родственника"""
  name: String
  """Тип родства (супруг, ребёнок, родитель и т.д.)"""
  relationType: String
}
